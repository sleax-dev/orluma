[package]
name = "orluma"
description = "Orluma - backups for your servers, run from your desktop."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "orluma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
orluma-core = { path = "../crates/core" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
mdns-sd = "0.13"
spake2 = "0.4"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
minisign-verify = "0.3"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

[build-dependencies]
tauri-build = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[workspace]
resolver = "3"
members = ["crates/core", "crates/agent", "src-tauri"]
default-members = ["crates/core", "crates/agent", "src-tauri"]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/sleax-dev/orluma"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
